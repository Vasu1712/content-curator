<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curator Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Initial / Input Screen ──────────────────────────────────── -->
  <div id="screen-input" class="screen screen-input">
    <div class="canvas">
      <h1 class="title">Curator Agent</h1>

      <div id="hint-text" class="hint-text">
        Add file or attach url from the buttons to curate your learnings against your objective
      </div>

      <div class="objective-wrapper">
        <input
          id="objective-input"
          class="objective-input"
          type="text"
          placeholder="write your learning objective here....."
        />
      </div>

      <div class="bottom-bar">
        <button class="icon-btn" id="btn-attach-file" title="Attach file">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea
          id="content-input"
          class="content-input"
          placeholder="write your source content here....."
          rows="1"
        ></textarea>
        <button class="icon-btn" id="btn-attach-url" title="Attach URL">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
          </svg>
        </button>
        <button class="submit-btn" id="btn-submit" title="Submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Active / Results Screen ─────────────────────────────────── -->
  <div id="screen-active" class="screen screen-active hidden">
    <h1 class="title title-active">Curator Agent</h1>

    <div class="three-col">

      <!-- Left: attached files -->
      <div class="panel panel-left">
        <h2 class="panel-heading">attached files</h2>
        <div id="files-list" class="files-list"></div>
      </div>

      <!-- Center: chat -->
      <div class="panel panel-center">
        <span class="chat-label">chat</span>

        <div id="objective-box" class="chat-box objective-box"></div>

        <div id="content-preview-box" class="chat-box content-preview hidden"></div>

        <div id="curated-bundle-box" class="chat-box bundle-box hidden">
          <div class="box-label">curated_bundle</div>
          <div id="curated-bundle-text"></div>
        </div>

        <div id="challenge-box" class="chat-box challenge-box hidden">
          <h3 class="challenge-title">dynamic_challenge</h3>
          <p id="challenge-text" class="challenge-text"></p>

          <div id="rationale-box" class="rationale-box">
            <span id="rationale-text"></span>
          </div>

          <div id="source-snippet-box" class="source-snippet"></div>

          <textarea
            id="answer-input"
            class="answer-input"
            placeholder="Write your answer here..."
            rows="3"
          ></textarea>

          <button class="submit-answer-btn" id="btn-submit-answer">submit</button>
        </div>

        <div id="eval-result-box" class="chat-box eval-box hidden">
          <div class="box-label">evaluation result</div>
          <div id="eval-score"></div>
          <div id="eval-feedback"></div>
          <div id="eval-pass"></div>
        </div>

        <div id="loading-box" class="loading-box hidden">
          <div class="spinner"></div>
          <span>Curating your content...</span>
        </div>
      </div>

      <!-- Right: url sources -->
      <div class="panel panel-right">
        <h2 class="panel-heading">url sources</h2>
        <div id="urls-list" class="urls-list"></div>
      </div>

    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" multiple accept=".txt,.md,.pdf,.html,.py,.js,.ts,.json,.csv" style="display:none" />

  <!-- URL input modal -->
  <div id="url-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Add URL</h3>
      <input id="url-modal-input" type="url" placeholder="https://..." class="modal-input" />
      <div class="modal-actions">
        <button id="btn-url-cancel" class="modal-btn modal-btn-cancel">Cancel</button>
        <button id="btn-url-add" class="modal-btn modal-btn-add">Add</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
